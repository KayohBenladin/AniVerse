<!DOCTYPE html>
<html>
<head>
    <title>AniVerse - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<main>

    <section class="login-box">

        <img src="images/logo.png" alt="AniVerse Logo" class="login-logo">

        <h1>Welcome to AniVerse</h1>

        <p>Sign in to continue to our website.</p>

        <form>

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password">

            <a href="index.html" class="login-button">Log In</a>

        </form>

    </section>

</main>

<footer>
    <p>AniVerse - Anime, Manga & Merchandise</p>
    <p>Copyright © 2026 | Created by Benladin S. Kayoh</p>
</footer>

</body>
</html>
